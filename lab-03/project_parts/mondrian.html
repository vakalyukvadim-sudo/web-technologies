<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Завдання 2 — Картина Мондріана</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        table {
            border-collapse: collapse;
            margin: 30px auto;
            width: 500px;
            height: 500px;
            /* Зовнішня жирна рамка картини */
            border: 8px solid #000000; 
        }

        td {
            /* Жирні чорні лінії розділення комірок */
            border: 8px solid #000000;
            padding: 0;
        }

        /* Кольори точно за вашим зразком */
        .white { background-color: #ffffff; }
        .yellow { background-color: #fffa69; }
        .blue { background-color: #074481; }
        .red { background-color: #ff5b2d; }
        .black { background-color: #000000; }
    </style>
</head>

<body>

    <h1>Композиція з червоним, синім і жовтим</h1>

    <table>
        <!-- РЯДОК 1: Верхня частина (Червоний та Жовтий блоки) -->
        <tr>
            <td class="white" rowspan="2" style="width: 15%;"></td>
            <td class="red" rowspan="2" style="width: 45%;"></td>
            <td class="white" style="width: 15%; height: 70px;"></td>
            <td class="yellow" style="width: 25%;"></td>
        </tr>

        <!-- РЯДОК 2: Зона під жовтим квадратом -->
        <tr>
            <td class="white" style="height: 150px;"></td>
            <td class="white"></td>
        </tr>

        <!-- РЯДОК 3: Середня частина (Чорний квадрат та білі блоки) -->
        <tr>
            <td class="white" style="height: 120px;"></td>
            <td class="black" rowspan="2"></td>
            <td class="white" colspan="2"></td>
        </tr>

        <!-- РЯДОК 4: Нижня частина (Синій блок праворуч та жовтий ліворуч) -->
        <tr>
            <td class="yellow" rowspan="2"></td>
            <td class="blue" colspan="2" style="height: 80px;"></td>
        </tr>

        <!-- РЯДОК 5: Найнижчий рядок (Біла комірка по центру під чорною) -->
        <tr>
            <td class="white" style="height: 60px;"></td>
            <td class="white" colspan="2"></td>
        </tr>
    </table>

    <!-- Обов'язкова умова лабораторної для посилання -->
    <p style="text-align: center;">
        <a href="../index.html">Повернутись на головну</a>
    </p>

</body>
</html>
